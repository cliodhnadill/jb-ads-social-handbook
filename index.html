"<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"joi\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ads &amp; Social — Designer Handbook · J+B<\u002Ftitle>\n\n<style>/* =============================================================\n   J+B · Foundation tokens\n   Source of truth. Import from sister projects via cross-project read.\n   Version: 2027.01.1\n   Changelog:\n     2027.01.1 · MIGRATION · Foundation re-IDed from\n                 c2029a8b-a425-48d3-9634-f3785555201e to\n                 d1984324-efd4-451d-8bb5-43ae25cfc93a for platform\n                 DS-attach compatibility. No token changes;\n                 bit-identical port. This is the version line this\n                 (new-ID) project should have carried at port time but\n                 didn't — recorded here to reconcile Foundation's own\n                 audit trail with DS · Ads & Social's already-shipped\n                 v2027.01.1 entry. Sister DSes (Website, Ads & Social,\n                 Email) must point their sync recipe at the new ID.\n                 Patch-ping outbound.\n     2026.12.6 · MIRROR · no token changes. Bumped to align Foundation's\n                version line with DS · Ads & Social's v2026.12.6 build\n                (which patched their Headline component to consume\n                --jb-fw-display-sans, ratified in v2026.12.5). This\n                project's tokens.css stays semantically identical to\n                v2026.12.5; only the version header changes. Closes the\n                cross-project version-line mismatch flagged by Website\n                DS + Ad Studio · Reference engineers during patch-ping\n                verification.\n                Going forward: when a sister-project ships a build\n                against a Foundation token rule, Foundation mirror-bumps\n                its tokens.css so the sync card §03 version-line check\n                stays meaningful across the layer.\n     2026.12.5 · PATCH · codifies the Basis sans display-weight rule\n                 that's been operating implicitly. RATIFIED:\n                   · Basis sans HEADLINES — always Regular (400).\n                     Never Bold, never Medium, never Black.\n                   · Basis sans COPY BODY — Regular default. Bold (700)\n                     allowed for in-line emphasis (a few words).\n                     Never for a full sentence or paragraph.\n                   · Basis sans BUTTONS / EYEBROWS — Medium (500) per\n                     existing component conventions. Unchanged.\n                 NEW TOKEN · --jb-fw-display-sans = var(--jb-w-regular).\n                 Surfaces consuming --jb-fw-display-sans for any\n                 [data-display-posture=\"sans\"] block automatically\n                 resolve to Regular. Website DS components.css needs\n                 a parallel \"Basis is never Bold as headline\" forcing\n                 rule (like the existing Simula-never-Bold rule);\n                 patch-pinged separately.\n                 Closes a Website DS render that landed sans display\n                 at Bold weight — unratified posture choice;\n                 retroactively corrected to Regular.\n     2026.12.4 · PATCH · adopts the stricter eyebrow ad-floor that\n                 DS · Ads & Social already retired 18px to locally\n                 (their internal DS v1.6 had bumped to 22px without\n                 surfacing a Foundation proposal). RATIFIED: 22 wins,\n                 18 retired. Stricter floor = better legibility at\n                 feed scale; production was already shipping 22.\n                 --jb-fs-ad-floor-eyebrow: 18px → 22px.\n                 Body (20) and subhead (28) unchanged.\n                 Surfaces the gap on the other direction too — DS\n                 retired the value locally without a brief; second\n                 instance of work-then-tell. Patch-ping rule now in\n                 brand-directions.html §rollout closes the loop\n                 forward; this patch closes the historical drift.\n     2026.12.3 · PATCH · closes Q3 from the 2026.05.20 Blokes brief\n                 (see _review/Warm-black-AB.html for the comparison).\n                 PRIMARY SWAP REJECTED · --jb-black #101010 stays as\n                 the Blokes page surface. The cool-light/cool-dark\n                 symmetry with Joi cream is load-bearing for the\n                 inverted-treatment vocabulary.\n                 SECONDARY TIER RATIFIED · the warm-black hexes from\n                 the brief land as SECONDARY surfaces on Blokes —\n                 cards, plates, hero bands, inset panels — not page\n                 surfaces. Mirrors how Joi has cream (page) +\n                 cream-deep (cards). This solves the brief's\n                 \"Blokes feels under-considered\" instinct without\n                 breaking the inverted-treatment system.\n                 NEW TOKENS ·\n                   --jb-black-warm:      #161310  (Blokes cards / plates)\n                   --jb-black-warm-deep: #1F1A14  (Blokes hero band / inset)\n                 Q3.1 open · verify what social actually ships on. If\n                 they're on warm-black at the page level, they migrate\n                 to using it for secondary surfaces only — page stays\n                 on --jb-black. Send three reference frames to confirm.\n     2026.12.2 · PATCH · explicit reaffirmation of Blokes accent =\n                 periwinkle (--jb-blue #BACDFF), in response to a\n                 2026.05.20 brief from J+B Landing Pages\n                 (_scratch/brand-directions/FOUNDATION-BRIEF.md in that\n                 project) that proposed burnt sienna #C2724A as\n                 --jb-blokes-accent. Decision: REJECTED. Periwinkle\n                 stays as the cross-brand family link — same accent on\n                 Joi (light surface) and Blokes (dark surface). Brief\n                 was filed in May but never made it to Foundation's\n                 _review/ surface; routing fix below.\n                 Brief ALSO proposed warm-black surface tokens for Blokes\n                 (#161310 instead of pure --jb-black #101010). FLAGGED\n                 separately in _review/Blokes-brief-resolution.html for\n                 ratification or rejection in a follow-up patch \\u2014 not\n                 settled here.\n                 No token changes in this patch. Documentation only.\n     2026.12.1 · PATCH · resolved the two deferred Discuss items from\n                 _review/PDP-lift-candidates.html. Both ruled LP-local\n                 (conservative call from Website DS owner, ratified by\n                 Foundation):\n                   · Q1 Trustpilot proof rail → composable, NOT locked.\n                     TP card stays LP-local; lift only the BigNum +\n                     ReorderCard composite. Trigger to revisit: 2-yr\n                     TP contract OR second review-platform LP.\n                   · Q2 Rx-pill product chrome → LP-local on N=1.\n                     Trigger to revisit: second Joi Rx surface using\n                     same chrome (account portal · refill receipt ·\n                     prescription summary).\n                 No token changes; both decisions are about pattern\n                 ownership, not tokens. Website DS v1.3 ships the\n                 6 ratified patterns; deferred patterns formally stay\n                 in J+B Landing Pages production code.\n     2026.12   · RATIFIED 6 LP patterns lifted from J+B Landing Pages\n              (Joi-TRT-LP-PDP) into Website DS:\n                · HeroPDP         (split media + plan picker)\n                · StepsThree      (numbered phase steps, Arabic ordinals)\n                · BenefitsGrid    (numbered N-up with mono prefix)\n                · StudyPlate      (periwinkle-dusk plate, editorial-medical)\n                · QuoteCardRow    (3-up quotes with italic emphasis)\n                · FinalCTADark    (dark close, italic-tail headline)\n              Two patterns deferred to v2026.13 pending discussion:\n                · §05 Trustpilot platform commitment\n                · §08 Rx-pill product chrome ownership\n              See _review/PDP-lift-candidates.html for rationale and\n              _review/WebsiteDS-pattern-lift-v1.html for the patterns\n              themselves — Website DS to import via cross-project read.\n              NEW TOKEN · --jb-blue-dusk: #252B50 — the periwinkle-dusk\n              surface for StudyPlate. Pulled up from --lp-study-bg (was\n              local to J+B Landing Pages); now a Foundation-owned\n              surface available to any sister project.\n     2026.11 · REVERTED 2026.10. Founder re-reviewed and returned to the\n              v2026.08 deeper-wash call. --jb-blue-surface back to #C8D4F2;\n              pastel #E6EDFF RETAINED as --jb-blue-surface-soft (renamed\n              from -deep so naming reflects relative position to the new\n              default). Net: both periwinkles still in the palette, default\n              signature wash is the deeper one again. Closes the loop on\n              the two-step revision — see _review/Periwinkle-AB.html for\n              the comparison that drove both calls; the doc's outcome\n              banner now reflects the final state.\n     2026.10 · REVISED 2026.08 periwinkle-wash call. Founder review on\n              _review/Periwinkle-AB.html (hero composition rendered in\n              both candidates over real product photography) flipped the\n              call back to the lighter pastel. --jb-blue-surface NOW\n              resolves to #E6EDFF as the Joi signature wash. The deeper\n              #C8D4F2 is RETAINED in the palette as --jb-blue-surface-deep\n              — reserved for moments needing more contrast (final-CTA\n              bands, accent washes inside dark sections); not the default\n              signature surface. Trade-off accepted: lives adjacent to\n              the wellness-pastel category (Maude/Curology), gained in\n              approachability + softer-launch posture. See brand-directions.html\n              hero meta for revision marker; tokens.css consumers pick this\n              up automatically on next session.\n     2026.09 · Ratified from DS · Ads & Social v1.4 proposal:\n              +--jb-fs-ad-floor-eyebrow / -body / -subhead — minimum\n              type sizes on any 1080-edge ad surface (IG feed, story,\n              reel). Production has been silently overriding to these\n              values; codifying. Closes GAP 07.\n              REAFFIRMED · --jb-font-mono stays as ratified in 2026.08.\n              Social Studio DS proposed drop (GAP 09); rejected —\n              ratified decisions don't reverse on a single sister\n              project's surface preference. If a surface needs\n              Simula Roman for ordinals, that's a component choice.\n              ACCEPTED roles (composable carousel): CarouselHook,\n              CarouselProduct, CarouselSteps, CarouselCTA. Candidate\n              tier (pending two real shipped uses): CarouselSplit,\n              CarouselInsights. See _review/DS-v1.4-decision.html.\n              HELD · Studio · Soft photo mode (GAP 05) — awaiting\n              reference frames from Studio DS before ratify-or-retune.\n              DEFERRED · Caption companion field (GAP 06) → v1.5 scope.\n     2026.08 · Mono role formalized — promoted system stack from\n              fallback to intentional. SF Mono is the reference\n              rendering; cross-OS variance is accepted because\n              mono is supporting texture, not brand voice. Future\n              upgrade path (licensed family) noted but not blocked.\n     2026.08 · RATIFIED — Joi (cream + periwinkle wash on signature\n              surfaces) and Blokes (dark + periwinkle accent) as paired\n              brand postures sharing the periwinkle accent vocabulary.\n              +--jb-blue-surface (deeper periwinkle for hero washes\n              and other Joi signature surfaces — #C8D4F2, escapes the\n              pastel-periwinkle mass-DTC category). +--jb-bg-signature\n              semantic alias — resolves to deeper periwinkle on Joi,\n              near-black on Blokes. See brand-directions.html for\n              rationale, LP Comparison.html for the visual evidence.\n     2026.07 · +Joi/Blokes theme split (derived from production\n              Figma library). Semantic aliases now switch via\n              [data-theme=\"joi\"] / [data-theme=\"blokes\"]. +warm\n              off-white text token. +utility neutral tokens used\n              by production buttons (rgb 187, 229 borders).\n     2026.06 · +control heights (btn/form), +sticky-bar-h, +side-rail-w,\n              +DS-internal status palette. Merged from Website DS.\n     2026.05 · Removed yellow accent (#F2FD7C).\n   ============================================================= */\n\n:root {\n  /* ---------- Color · core ---------- */\n  --jb-white:        #FFFFFF;   /* Primary surface */\n  --jb-gray:         #E5E5E5;   /* Neutral · dividers, rails */\n  --jb-gray-dark:    #363636;   /* Neutral · secondary type */\n  --jb-black:        #101010;   /* Primary ink */\n  --jb-blue:         #BACDFF;   /* Periwinkle accent · moments + family link */\n  --jb-blue-surface: #C8D4F2;   /* Periwinkle wash · Joi signature surface (hero, final CTA).\n                                   Deeper-by-design — escapes the wellness-pastel category\n                                   (Maude/Curology/Hims-women zone) while still reading as\n                                   the family periwinkle. Ratified v2026.08 · briefly\n                                   reversed to pastel in v2026.10 · returned to deeper\n                                   v2026.11. See _review/Periwinkle-AB.html for comparison. */\n  --jb-blue-surface-soft: #E6EDFF;   /* Pastel periwinkle · RETAINED in palette.\n                                        Lighter wash for softer moments — secondary\n                                        editorial plates, ambient backgrounds, places where\n                                        the deeper wash would over-saturate against warm\n                                        photography. Sits adjacent to the wellness-pastel\n                                        category by design; use with intent. Not the default\n                                        signature surface. */\n  --jb-blue-dusk:    #252B50;   /* Periwinkle-dusk · editorial-medical plate surface.\n                                   Pulled up from J+B Landing Pages --lp-study-bg to a\n                                   Foundation-owned surface in v2026.12. Used by StudyPlate\n                                   and any other section that needs a dark plate that still\n                                   reads as periwinkle family (NOT generic dark). Light type\n                                   over it; periwinkle accent (#BACDFF) reads as a quiet\n                                   highlight against this surface, not a clash. */\n\n  /* ---------- Blokes · secondary dark surfaces ----------\n     Ratified v2026.12.3 from the 2026.05.20 J+B LP brief, Q3 close.\n     For SECONDARY use only — cards, plates, hero bands, inset panels.\n     The Blokes PAGE surface stays --jb-black #101010 (the inverted\n     symmetry with Joi cream is non-negotiable). These warm-tinted\n     darks parallel how Joi has --jb-cream / --jb-cream-deep:\n       · --jb-black            page surface\n       · --jb-black-warm       card / plate surface (warm)\n       · --jb-black-warm-deep  hero band / inset (warmest) */\n  --jb-black-warm:        #161310;   /* Blokes cards / plates · warm-tinted dark */\n  --jb-black-warm-deep:   #1F1A14;   /* Blokes hero band / inset · warmest */\n\n  /* ---------- Color · warm extended (from ad photography) ---------- */\n  --jb-cream:        #F4EFE7;   /* Editorial background */\n  --jb-cream-deep:   #ECE5D8;\n  --jb-rule:         #C9C0AE;\n  --jb-rule-soft:    #DBD2BD;\n\n  /* ---------- Color · production utility neutrals (from Figma library) ---------- */\n  --jb-off-white:    #FFFEF2;   /* Warm off-white · Joi button label color */\n  --jb-border-soft:  #BBBBBB;   /* Secondary-Joi button border */\n  --jb-border-faint: #E5E5E5;   /* Secondary-Blokes button border (= jb-gray) */\n  --jb-text-muted:   #747474;   /* Secondary text color in product cards */\n\n  /* ---------- Type families ---------- */\n  --jb-font-sans:    \"Basis Grotesque\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --jb-font-serif:   \"Simula\", \"Times New Roman\", Times, serif;\n\n  /* Mono — system stack by design, not by omission.\n     Reference rendering is SF Mono on Apple platforms (the majority\n     of Joi traffic). We accept Cascadia Mono / Roboto Mono variance\n     on Windows / Android because mono only ever carries supporting\n     texture in this system — spec tags, image counters, dose chips,\n     legalese — never brand voice. Simula does brand voice; Basis\n     does interface voice; mono is the lab-label register.\n     Revisit if we ever ship at scale in print or packaging, where\n     a single licensed family becomes worth the cost.\n     Decided 2026.05.21 · documented in brand-directions.html. */\n  --jb-font-mono:    ui-monospace, \"SF Mono\", \"Cascadia Mono\",\n                     \"Roboto Mono\", Menlo, Consolas, monospace;\n\n  /* ---------- Type · weights (Basis) ---------- */\n  --jb-w-light:      300;\n  --jb-w-regular:    400;\n  --jb-w-medium:     500;   /* Body emphasis (testimonial names, list labels, captions). Confirmed in-spec v2026.12.6 — ruling closes LP-flagged drift question. */\n  --jb-w-bold:       700;   /* In-line copy emphasis only. NEVER as headline weight — v2026.12.5. */\n  --jb-w-black:      900;   /* Reserved · not used in shipped surfaces today. */\n\n  /* ---------- Type · display weight rules ----------\n     Two forcing rules govern brand-font weight at display scale:\n       · Simula serif — NEVER Bold. Browser defaults on h1–h6 + <strong>\n         would otherwise force 700; components.css forces back to Regular.\n       · Basis sans — Headlines ALWAYS Regular. Bold (700) is permitted\n         in copy body for in-line emphasis (a few words), never for\n         headlines, never for full sentences or paragraphs.\n     Ratified v2026.12.5. The token below is the canonical display\n     weight for [data-display-posture=\"sans\"]; consume it via\n     --jb-font-display + --jb-fw-display in your .jb-display utility. */\n  --jb-fw-display-sans:   var(--jb-w-regular);\n  --jb-fw-display-serif:  var(--jb-w-regular);\n\n  /* ---------- Type · ramp (clamp() for responsive surfaces) ---------- */\n  --jb-fs-eyebrow:   11px;\n  --jb-fs-caption:   12px;\n  --jb-fs-body:      16px;\n  --jb-fs-lede:      18px;\n  --jb-fs-h6:        20px;\n  --jb-fs-h5:        24px;\n  --jb-fs-h4:        clamp(28px, 2.4vw, 36px);\n  --jb-fs-h3:        clamp(36px, 3.5vw, 48px);\n  --jb-fs-h2:        clamp(48px, 5vw, 72px);\n  --jb-fs-h1:        clamp(72px, 9vw, 144px);\n  --jb-fs-display:   clamp(96px, 12vw, 200px);\n\n  /* ---------- Type · ad-surface accessibility floor ----------\n     Minimum on any J+B social ad surface — all 1080-edge:\n       · 1080 × 1080   IG square feed\n       · 1080 × 1350   IG vertical feed (4:5)\n       · 1080 × 1920   IG story / reel (9:16)\n     No 16:9 surface in scope. Production was silently overriding\n     to these values; ratified 2026.09 from DS · Ads & Social v1.4\n     (GAP 07). Below these, type renders under ~4px at feed scale\n     and fails legibility review. These are FLOORS, not defaults\n     — go larger when you can. */\n  --jb-fs-ad-floor-eyebrow:   22px;   /* Bumped from 18px in v2026.12.4 — adopting\n                                          DS · Ads & Social's stricter local floor */\n  --jb-fs-ad-floor-body:      20px;\n  --jb-fs-ad-floor-subhead:   28px;\n\n  /* ---------- Type · tracking ---------- */\n  --jb-ls-eyebrow:   0.22em;   /* uppercase labels */\n  --jb-ls-tight:     -0.01em;  /* large headlines */\n  --jb-ls-snug:      -0.005em;\n  --jb-ls-normal:    0;\n\n  /* ---------- Type · leading ---------- */\n  --jb-lh-display:   0.95;\n  --jb-lh-headline:  1.05;\n  --jb-lh-snug:      1.25;\n  --jb-lh-body:      1.5;\n  --jb-lh-loose:     1.65;\n\n  /* ---------- Spacing scale (4-based) ---------- */\n  --jb-sp-1:         4px;\n  --jb-sp-2:         8px;\n  --jb-sp-3:         12px;\n  --jb-sp-4:         16px;\n  --jb-sp-5:         24px;\n  --jb-sp-6:         32px;\n  --jb-sp-7:         48px;\n  --jb-sp-8:         64px;\n  --jb-sp-9:         96px;\n  --jb-sp-10:        128px;\n\n  /* ---------- Control heights ---------- */\n  /* Button heights — full pill or rectangular. Used across all surfaces. */\n  --jb-btn-h-sm:     32px;\n  --jb-btn-h-md:     40px;\n  --jb-btn-h-lg:     56px;\n\n  /* Form input heights — deliberately distinct from button scale.\n     Inputs need vertical room for label + value; buttons don't. */\n  --jb-form-row-h:   52px;\n\n  /* ---------- Surface widths ---------- */\n  /* Sticky bottom CTA — fixed height for LP / mobile product pages.\n     Used as both element height AND body bottom-padding so content\n     never sits under the bar. */\n  --jb-sticky-bar-h: 56px;\n\n  /* Desktop side rail — PDP purchase rail, sticky pricing column.\n     Mobile collapses; this token applies ≥1024px. */\n  --jb-side-rail-w:  360px;\n\n  /* ---------- Radii ---------- */\n  --jb-radius-none:  0;\n  --jb-radius-sm:    4px;\n  --jb-radius-md:    8px;\n  --jb-radius-lg:    16px;\n  --jb-radius-pill:  999px;\n\n  /* ---------- Rules ---------- */\n  --jb-rule-dashed:  1px dashed var(--jb-rule);\n  --jb-rule-solid:   1px solid var(--jb-rule);\n\n  /* ---------- Motion ---------- */\n  --jb-ease:         cubic-bezier(0.22, 0.61, 0.36, 1);\n  --jb-dur-fast:     150ms;\n  --jb-dur-base:     250ms;\n  --jb-dur-slow:     450ms;\n\n  /* ---------- Layout ---------- */\n  --jb-max:          1320px;\n  --jb-gutter:       clamp(20px, 4vw, 56px);\n}\n\n/* =============================================================\n   DS-internal status palette\n   NOT for production UI. Used by DS pages, component libraries, and\n   internal tooling to flag where a component sits in the migration\n   from current state to North Star.\n   ============================================================= */\n\n:root {\n  --jb-internal-status-shipped:    #1F8A5B;   /* ● in production today */\n  --jb-internal-status-refresh:    #C67A1E;   /* ◐ exists, new version in DS */\n  --jb-internal-status-future:     #2A6FDB;   /* ○ doesn't exist yet */\n  --jb-internal-status-deprecated: #8A8A8A;   /* ⊘ do not use in new work */\n}\n\n/* =============================================================\n   Semantic aliases — surface DS systems extend these.\n\n   Defaults below resolve to the \"Joi\" treatment (light surface).\n   Apply data-theme=\"joi\" or data-theme=\"blokes\" on <html> / <body>\n   or any subtree to switch. Same component code, two skins.\n   ============================================================= */\n\n:root {\n  /* Surfaces */\n  --jb-bg:               var(--jb-white);\n  --jb-bg-editorial:     var(--jb-cream);\n  --jb-bg-deep:          var(--jb-black);\n  --jb-bg-signature:     var(--jb-blue-surface);  /* Brand-signature surface\n                                                     — hero washes, final CTA bands.\n                                                     Resolves per theme: deeper\n                                                     periwinkle on Joi, near-black\n                                                     on Blokes. */\n\n  /* Ink */\n  --jb-ink:              var(--jb-black);\n  --jb-ink-soft:         var(--jb-gray-dark);\n  --jb-ink-muted:        var(--jb-text-muted);\n  --jb-ink-inverse:      var(--jb-cream);\n\n  /* Accent */\n  --jb-accent:           var(--jb-blue);\n\n  /* Buttons — primary (filled) */\n  --jb-btn-primary-bg:       var(--jb-gray-dark);     /* dark on light */\n  --jb-btn-primary-fg:       var(--jb-off-white);     /* warm off-white */\n  --jb-btn-primary-bg-hover: var(--jb-black);\n\n  /* Buttons — secondary (outlined) */\n  --jb-btn-secondary-bg:     transparent;\n  --jb-btn-secondary-fg:     var(--jb-gray-dark);\n  --jb-btn-secondary-border: var(--jb-border-soft);\n}\n\n/* =============================================================\n   Theme · Joi  (light surface, women's brand)\n   Light page · dark filled buttons · cream text on primary.\n   ============================================================= */\n\n[data-theme=\"joi\"] {\n  --jb-bg:                   var(--jb-white);\n  --jb-bg-signature:         var(--jb-blue-surface);  /* deeper periwinkle wash */\n  --jb-ink:                  var(--jb-gray-dark);\n  --jb-ink-soft:             var(--jb-text-muted);\n  --jb-ink-inverse:          var(--jb-off-white);\n\n  --jb-btn-primary-bg:       var(--jb-gray-dark);\n  --jb-btn-primary-fg:       var(--jb-off-white);\n  --jb-btn-primary-bg-hover: var(--jb-black);\n\n  --jb-btn-secondary-bg:     transparent;\n  --jb-btn-secondary-fg:     var(--jb-gray-dark);\n  --jb-btn-secondary-border: var(--jb-border-soft);\n}\n\n/* =============================================================\n   Theme · Blokes  (dark surface, men's brand)\n   Dark page · light filled buttons · dark text on primary.\n   The Blokes treatment expects a dark or near-dark surface — set\n   --jb-bg explicitly on the host element (often --jb-black).\n   ============================================================= */\n\n[data-theme=\"blokes\"] {\n  --jb-bg:                   var(--jb-black);\n  --jb-bg-signature:         var(--jb-black);        /* dark surface IS the signature */\n  --jb-ink:                  var(--jb-white);\n  --jb-ink-soft:             var(--jb-gray);\n  --jb-ink-inverse:          var(--jb-gray-dark);\n\n  --jb-btn-primary-bg:       var(--jb-white);\n  --jb-btn-primary-fg:       var(--jb-gray-dark);\n  --jb-btn-primary-bg-hover: var(--jb-cream);\n\n  --jb-btn-secondary-bg:     transparent;\n  --jb-btn-secondary-fg:     var(--jb-white);\n  --jb-btn-secondary-border: var(--jb-border-faint);\n}\n\n/* =============================================================\n   Webfont declarations — point to brand/fonts/ in Foundation.\n   Sister projects: copy the brand/fonts/ folder, or absolute-path\n   to a hosted version.\n   ============================================================= */\n\n/* Disable browser-faked bold/italic so Simula always renders at its\n   true Book weight — no synthesized heavier italic. */\nhtml { font-synthesis: none; -webkit-font-synthesis: none; }\n\n@font-face {\n  font-family: \"Basis Grotesque\";\n  src: url(\"57c07c2c-3a6b-43f1-8a8d-30f9df406cea\") format(\"truetype\");\n  font-weight: 300; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"Basis Grotesque\";\n  src: url(\"55d5eb52-c914-40bd-af4f-7c85849107ba\") format(\"truetype\");\n  font-weight: 400; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"Basis Grotesque\";\n  src: url(\"b6f9cfe4-5881-40ba-8912-12a91a321d3e\") format(\"truetype\");\n  font-weight: 500; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"Basis Grotesque\";\n  src: url(\"86d664bc-4603-4404-aebb-d2f7d7c57420\") format(\"truetype\");\n  font-weight: 700; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"Basis Grotesque\";\n  src: url(\"c431bbac-ec46-4ec3-a3bf-f04e2e208ba8\") format(\"truetype\");\n  font-weight: 900; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"Simula\";\n  src: url(\"2d676a79-0fd6-43f5-834a-dd1ee8f17427\") format(\"truetype\");\n  font-weight: 400; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"Simula\";\n  src: url(\"d487caae-8e58-4fdb-bdbc-8c0e2e386253\") format(\"truetype\");\n  font-weight: 400; font-style: italic; font-display: swap;\n}\n<\u002Fstyle>\n\n<style>\n  :root {\n    --hb-max:        920px;\n    --hb-gutter:     clamp(20px, 4vw, 56px);\n    --hb-ink:        var(--jb-black-warm);\n    --hb-ink-muted:  rgba(22, 19, 16, 0.60);\n    --hb-ink-soft:   rgba(22, 19, 16, 0.80);\n    --hb-bg:         var(--jb-cream);\n    --hb-plate:      var(--jb-blue-surface);\n    --hb-rule:       var(--jb-rule);\n    --hb-rule-soft:  var(--jb-rule-soft);\n  }\n\n  *, *::before, *::after { box-sizing: border-box; }\n\n  html, body {\n    margin: 0; padding: 0;\n    background: var(--hb-bg);\n    color: var(--hb-ink);\n    font-family: var(--jb-font-sans);\n    font-size: var(--jb-fs-body);\n    line-height: var(--jb-lh-body);\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n  }\n\n  /* ---------- Layout shell ---------- */\n  .hb-shell {\n    max-width: var(--hb-max);\n    margin: 0 auto;\n    padding: var(--jb-sp-9) var(--hb-gutter) var(--jb-sp-10);\n  }\n\n  /* ---------- Dotted header (CARE LETTER honor tag) ---------- */\n  .hb-honor {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding-bottom: var(--jb-sp-3);\n    border-bottom: 1px dotted var(--hb-rule);\n    margin-bottom: var(--jb-sp-7);\n    font-family: var(--jb-font-sans);\n    font-size: var(--jb-fs-caption);\n    text-transform: uppercase;\n    letter-spacing: var(--jb-ls-eyebrow);\n    color: var(--hb-ink-muted);\n  }\n  .hb-honor__right {\n    font-family: var(--jb-font-serif);\n    font-style: italic;\n    font-size: var(--jb-fs-body);\n    text-transform: none;\n    letter-spacing: 0;\n    color: var(--hb-ink-soft);\n  }\n\n  /* ---------- Wordmark ---------- */\n  .hb-wordmark {\n    font-family: var(--jb-font-serif);\n    font-style: italic;\n    font-weight: 400;\n    font-size: 48px;\n    line-height: 1;\n    color: var(--hb-ink);\n    margin: 0 0 var(--jb-sp-4);\n    letter-spacing: -0.01em;\n  }\n\n  /* ---------- Eyebrow ---------- */\n  .hb-eyebrow {\n    font-family: var(--jb-font-sans);\n    font-weight: 500;\n    font-size: var(--jb-fs-eyebrow);\n    text-transform: uppercase;\n    letter-spacing: var(--jb-ls-eyebrow);\n    color: var(--hb-ink-muted);\n    margin: 0 0 var(--jb-sp-4);\n  }\n\n  /* ---------- Display headline ---------- */\n  .hb-display {\n    font-family: var(--jb-font-serif);\n    font-weight: 400;\n    font-style: normal;\n    font-size: clamp(40px, 6vw, 72px);\n    line-height: var(--jb-lh-headline);\n    letter-spacing: var(--jb-ls-tight);\n    margin: 0 0 var(--jb-sp-5);\n    color: var(--hb-ink);\n    text-wrap: balance;\n  }\n  .hb-display em {\n    font-style: italic;\n  }\n\n  /* ---------- Dek ---------- */\n  .hb-dek {\n    font-family: var(--jb-font-sans);\n    font-weight: 400;\n    font-size: var(--jb-fs-lede);\n    line-height: var(--jb-lh-body);\n    color: var(--hb-ink-soft);\n    margin: 0 0 var(--jb-sp-7);\n    max-width: 60ch;\n    text-wrap: pretty;\n  }\n\n  /* ---------- Meta block (Sent / Read / From / Edition) ---------- */\n  .hb-meta {\n    display: grid;\n    grid-template-columns: max-content 1fr;\n    gap: var(--jb-sp-2) var(--jb-sp-5);\n    margin: 0 0 var(--jb-sp-8);\n    padding: var(--jb-sp-4) 0;\n    border-top: var(--jb-rule-dashed);\n    border-bottom: var(--jb-rule-dashed);\n    font-size: var(--jb-fs-caption);\n  }\n  .hb-meta dt {\n    font-family: var(--jb-font-sans);\n    font-weight: 500;\n    text-transform: uppercase;\n    letter-spacing: var(--jb-ls-eyebrow);\n    color: var(--hb-ink-muted);\n    margin: 0;\n  }\n  .hb-meta dd {\n    margin: 0;\n    color: var(--hb-ink-soft);\n    font-family: var(--jb-font-serif);\n    font-style: italic;\n  }\n\n  /* ---------- Section structure ---------- */\n  section.hb-section {\n    margin: var(--jb-sp-9) 0;\n  }\n  section.hb-section + section.hb-section {\n    border-top: var(--jb-rule-dashed);\n    padding-top: var(--jb-sp-9);\n  }\n\n  .hb-section__eyebrow {\n    font-family: var(--jb-font-sans);\n    font-weight: 500;\n    font-size: var(--jb-fs-eyebrow);\n    text-transform: uppercase;\n    letter-spacing: var(--jb-ls-eyebrow);\n    color: var(--hb-ink-muted);\n    margin: 0 0 var(--jb-sp-3);\n  }\n  .hb-section__title {\n    font-family: var(--jb-font-serif);\n    font-weight: 400;\n    font-size: clamp(28px, 3.5vw, 40px);\n    line-height: var(--jb-lh-headline);\n    letter-spacing: var(--jb-ls-tight);\n    margin: 0 0 var(--jb-sp-6);\n    color: var(--hb-ink);\n    text-wrap: balance;\n  }\n\n  /* ---------- Body prose ---------- */\n  .hb-prose p {\n    margin: 0 0 var(--jb-sp-4);\n    color: var(--hb-ink-soft);\n    max-width: 70ch;\n    text-wrap: pretty;\n  }\n  .hb-prose p strong {\n    font-weight: 500;\n    color: var(--hb-ink);\n  }\n  .hb-prose p em {\n    font-family: var(--jb-font-serif);\n    font-style: italic;\n    color: var(--hb-ink);\n  }\n  .hb-prose ul, .hb-prose ol {\n    margin: 0 0 var(--jb-sp-5);\n    padding-left: var(--jb-sp-5);\n    color: var(--hb-ink-soft);\n    max-width: 70ch;\n  }\n  .hb-prose li {\n    margin-bottom: var(--jb-sp-2);\n  }\n  .hb-prose ol {\n    font-feature-settings: \"lnum\";\n  }\n\n  /* ---------- Subsection ---------- */\n  .hb-sub {\n    margin: var(--jb-sp-7) 0 var(--jb-sp-4);\n  }\n  .hb-sub__label {\n    font-family: var(--jb-font-sans);\n    font-size: var(--jb-fs-caption);\n    font-weight: 500;\n    text-transform: uppercase;\n    letter-spacing: var(--jb-ls-eyebrow);\n    color: var(--hb-ink-muted);\n    margin: 0 0 var(--jb-sp-2);\n  }\n  .hb-sub__title {\n    font-family: var(--jb-font-sans);\n    font-weight: 500;\n    font-size: var(--jb-fs-h6);\n    color: var(--hb-ink);\n    margin: 0 0 var(--jb-sp-3);\n    letter-spacing: var(--jb-ls-snug);\n  }\n\n  /* ---------- Code / prompt blocks ---------- */\n  pre.hb-code {\n    font-family: var(--jb-font-mono);\n    font-size: 13px;\n    line-height: 1.55;\n    background: var(--jb-black-warm);\n    color: var(--jb-off-white);\n    padding: var(--jb-sp-5);\n    border-radius: var(--jb-radius-sm);\n    overflow-x: auto;\n    margin: var(--jb-sp-4) 0 var(--jb-sp-5);\n    white-space: pre;\n  }\n  pre.hb-code .hb-code__token {\n    color: var(--jb-blue-surface);\n  }\n  code.hb-inline {\n    font-family: var(--jb-font-mono);\n    font-size: 0.92em;\n    background: rgba(22, 19, 16, 0.08);\n    padding: 1px 6px;\n    border-radius: 2px;\n    color: var(--hb-ink);\n  }\n\n  /* ---------- Periwinkle accent plate ---------- */\n  .hb-plate {\n    background: var(--hb-plate);\n    color: var(--jb-black-warm);\n    padding: var(--jb-sp-6) var(--jb-sp-6);\n    margin: var(--jb-sp-6) 0;\n    border-radius: var(--jb-radius-sm);\n  }\n  .hb-plate__eyebrow {\n    font-family: var(--jb-font-sans);\n    font-weight: 500;\n    font-size: var(--jb-fs-eyebrow);\n    text-transform: uppercase;\n    letter-spacing: var(--jb-ls-eyebrow);\n    color: rgba(22, 19, 16, 0.65);\n    margin: 0 0 var(--jb-sp-3);\n  }\n  .hb-plate p {\n    margin: 0 0 var(--jb-sp-3);\n    color: var(--jb-black-warm);\n  }\n  .hb-plate p:last-child { margin-bottom: 0; }\n  .hb-plate em {\n    font-family: var(--jb-font-serif);\n    font-style: italic;\n  }\n\n  /* ---------- Filename example chip ---------- */\n  .hb-fn {\n    display: inline-block;\n    font-family: var(--jb-font-mono);\n    font-size: 0.92em;\n    color: var(--hb-ink);\n    background: var(--jb-cream-deep);\n    padding: 3px 8px;\n    border-radius: 2px;\n    border: 1px solid var(--hb-rule-soft);\n  }\n  .hb-fn--bad {\n    color: rgba(22, 19, 16, 0.55);\n    text-decoration: line-through;\n    text-decoration-color: rgba(22, 19, 16, 0.35);\n  }\n\n  /* ---------- Table ---------- */\n  table.hb-table {\n    width: 100%;\n    border-collapse: collapse;\n    margin: var(--jb-sp-5) 0;\n    font-size: var(--jb-fs-caption);\n  }\n  table.hb-table thead th {\n    text-align: left;\n    font-family: var(--jb-font-sans);\n    font-weight: 500;\n    font-size: var(--jb-fs-eyebrow);\n    text-transform: uppercase;\n    letter-spacing: var(--jb-ls-eyebrow);\n    color: var(--hb-ink-muted);\n    padding: var(--jb-sp-2) var(--jb-sp-3) var(--jb-sp-2) 0;\n    border-bottom: var(--jb-rule-dashed);\n  }\n  table.hb-table tbody td {\n    padding: var(--jb-sp-3) var(--jb-sp-3) var(--jb-sp-3) 0;\n    border-bottom: var(--jb-rule-dashed);\n    vertical-align: top;\n    color: var(--hb-ink-soft);\n  }\n  table.hb-table tbody td:first-child {\n    color: var(--hb-ink);\n    font-weight: 500;\n    white-space: nowrap;\n  }\n  table.hb-table tbody td.hb-table__example {\n    font-family: var(--jb-font-mono);\n    font-size: 0.92em;\n    font-weight: 400;\n    color: var(--hb-ink-soft);\n    white-space: nowrap;\n  }\n\n  /* ---------- Numbered steps (Simula italic Roman) ---------- */\n  .hb-steps {\n    list-style: none;\n    padding: 0;\n    margin: var(--jb-sp-5) 0;\n    counter-reset: hb-step;\n  }\n  .hb-steps > li {\n    counter-increment: hb-step;\n    padding: var(--jb-sp-4) 0;\n    border-bottom: var(--jb-rule-dashed);\n    display: grid;\n    grid-template-columns: 64px 1fr;\n    gap: var(--jb-sp-4);\n    color: var(--hb-ink-soft);\n    max-width: 72ch;\n  }\n  .hb-steps > li:first-child {\n    border-top: var(--jb-rule-dashed);\n  }\n  .hb-steps > li::before {\n    content: counter(hb-step, lower-roman);\n    font-family: var(--jb-font-serif);\n    font-style: italic;\n    font-size: var(--jb-fs-h5);\n    color: var(--hb-ink);\n    line-height: 1;\n    padding-top: 2px;\n  }\n  .hb-steps__title {\n    font-weight: 500;\n    color: var(--hb-ink);\n    display: block;\n    margin-bottom: var(--jb-sp-1);\n    font-size: var(--jb-fs-body);\n  }\n\n  /* ---------- Dot bullets (sans, for symptom/feature stacks) ---------- */\n  .hb-dots {\n    list-style: none;\n    padding: 0;\n    margin: var(--jb-sp-4) 0 var(--jb-sp-5);\n    max-width: 72ch;\n  }\n  .hb-dots > li {\n    position: relative;\n    padding-left: var(--jb-sp-5);\n    margin-bottom: var(--jb-sp-3);\n    color: var(--hb-ink-soft);\n  }\n  .hb-dots > li::before {\n    content: \"\";\n    position: absolute;\n    left: 0;\n    top: 11px;\n    width: 6px; height: 6px;\n    border-radius: 50%;\n    background: var(--hb-ink);\n  }\n  .hb-dots > li strong {\n    font-weight: 500;\n    color: var(--hb-ink);\n  }\n\n  /* ---------- Do / Don't pair ---------- */\n  .hb-pair {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: var(--jb-sp-5);\n    margin: var(--jb-sp-5) 0;\n  }\n  .hb-pair__col {\n    padding: var(--jb-sp-5);\n    border-radius: var(--jb-radius-sm);\n    background: var(--jb-cream-deep);\n  }\n  .hb-pair__col h4 {\n    margin: 0 0 var(--jb-sp-3);\n    font-family: var(--jb-font-sans);\n    font-weight: 500;\n    font-size: var(--jb-fs-eyebrow);\n    text-transform: uppercase;\n    letter-spacing: var(--jb-ls-eyebrow);\n    color: var(--hb-ink);\n  }\n  .hb-pair__col p, .hb-pair__col li {\n    color: var(--hb-ink-soft);\n    margin: 0 0 var(--jb-sp-2);\n  }\n  .hb-pair__col ul {\n    padding-left: 0;\n    list-style: none;\n  }\n  .hb-pair__col li {\n    font-family: var(--jb-font-mono);\n    font-size: 12px;\n  }\n  @media (max-width: 720px) {\n    .hb-pair { grid-template-columns: 1fr; }\n  }\n\n  /* ---------- Pull quote ---------- */\n  .hb-pull {\n    border-left: 2px solid var(--hb-ink);\n    padding: var(--jb-sp-2) 0 var(--jb-sp-2) var(--jb-sp-5);\n    margin: var(--jb-sp-6) 0;\n    font-family: var(--jb-font-serif);\n    font-style: italic;\n    font-size: var(--jb-fs-h6);\n    line-height: var(--jb-lh-snug);\n    color: var(--hb-ink);\n    max-width: 60ch;\n    text-wrap: pretty;\n  }\n\n  /* ---------- Trust lockup (.jb-proof analogue) ---------- */\n  .hb-proof {\n    display: flex;\n    flex-wrap: wrap;\n    gap: var(--jb-sp-5) var(--jb-sp-7);\n    padding: var(--jb-sp-5) 0;\n    margin: var(--jb-sp-7) 0;\n    border-top: var(--jb-rule-dashed);\n    border-bottom: var(--jb-rule-dashed);\n  }\n  .hb-proof__item {\n    display: flex;\n    flex-direction: column;\n    gap: var(--jb-sp-1);\n  }\n  .hb-proof__label {\n    font-family: var(--jb-font-sans);\n    font-size: var(--jb-fs-eyebrow);\n    text-transform: uppercase;\n    letter-spacing: var(--jb-ls-eyebrow);\n    color: var(--hb-ink-muted);\n  }\n  .hb-proof__value {\n    font-family: var(--jb-font-serif);\n    font-style: italic;\n    font-size: var(--jb-fs-body);\n    color: var(--hb-ink);\n  }\n\n  /* ---------- Footer ---------- */\n  .hb-foot {\n    margin-top: var(--jb-sp-10);\n    padding-top: var(--jb-sp-6);\n    border-top: var(--jb-rule-dashed);\n    display: flex;\n    justify-content: space-between;\n    align-items: flex-end;\n    flex-wrap: wrap;\n    gap: var(--jb-sp-5);\n  }\n  .hb-foot__mark {\n    font-family: var(--jb-font-serif);\n    font-style: italic;\n    font-size: var(--jb-fs-h5);\n    color: var(--hb-ink);\n    opacity: 0.7;\n  }\n  .hb-foot__meta {\n    font-family: var(--jb-font-sans);\n    font-size: var(--jb-fs-eyebrow);\n    text-transform: uppercase;\n    letter-spacing: var(--jb-ls-eyebrow);\n    color: var(--hb-ink-muted);\n    text-align: right;\n  }\n  .hb-foot__meta div { margin-bottom: var(--jb-sp-1); }\n\n  /* ---------- Print ---------- */\n  @media print {\n    body { background: white; }\n    .hb-shell { padding: 0; max-width: none; }\n    pre.hb-code { background: #fafafa; color: #111; border: 1px solid #ddd; }\n    .hb-plate { background: #f0f0f0; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<main class=\"hb-shell\">\n\n  <!-- Dotted header honor tag -->\n  <div class=\"hb-honor\">\n    <span>Designer Handbook · No. 01<\u002Fspan>\n    <span class=\"hb-honor__right\">since 2026<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- Wordmark -->\n  <div class=\"hb-wordmark\">J+B<\u002Fdiv>\n\n  <!-- Eyebrow + display headline -->\n  <p class=\"hb-eyebrow\">Ads &amp; Social · Onboarding<\u002Fp>\n  <h1 class=\"hb-display\">Source-verify <em>everything.<\u002Fem><br>Then draft.<\u002Fh1>\n\n  <p class=\"hb-dek\">A working handbook for junior designers building ad and social creative inside J+B DS · Ads &amp; Social. It covers where work lives, how to name it, what to read before drafting, and what to send back before you ship.<\u002Fp>\n\n  <!-- Meta block -->\n  <dl class=\"hb-meta\">\n    <dt>Edition<\u002Fdt>     <dd>v1.1 · 2026.06.01<\u002Fdd>\n    <dt>For<\u002Fdt>         <dd>Junior designers, contractors, new hires<\u002Fdd>\n    <dt>DS attached<\u002Fdt> <dd>J+B DS · Ads &amp; Social — <code class=\"hb-inline\" style=\"background:rgba(255,255,255,0.4);padding:2px 6px;border-radius:2px;color:var(--jb-black-warm);\">82362aea-9fab-46c8-a299-8161517e0551<\u002Fcode><\u002Fdd>\n    <dt>Owner<\u002Fdt>       <dd>Design lead<\u002Fdd>\n  <\u002Fdl>\n\n  <!-- ============================================================\n       01 · The five-minute version\n       ============================================================ -->\n  <section class=\"hb-section\">\n    <p class=\"hb-section__eyebrow\">01 · The five-minute version<\u002Fp>\n    <h2 class=\"hb-section__title\">If you read nothing else, read this.<\u002Fh2>\n\n    <div class=\"hb-plate\">\n      <p class=\"hb-plate__eyebrow\">The #1 mistake — read before you do anything<\u002Fp>\n      <p>The Design System picker <strong>defaults to J+B Foundation<\u002Fstrong>. Foundation is <em>tokens only<\u002Fem> — no components, no patterns, no Mood. If you leave the default, your project can't build J+B creative. You <strong>must<\u002Fstrong> switch the picker to <strong>J+B DS · Ads &amp; Social<\u002Fstrong> (id <code class=\"hb-inline\" style=\"background:rgba(255,255,255,0.4);padding:2px 6px;border-radius:2px;color:var(--jb-black-warm);\">82362aea-9fab-46c8-a299-8161517e0551<\u002Fcode>). Do this every time. See step 2.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"hb-prose\">\n      <ol class=\"hb-steps\">\n        <li>\n          <span>\n            <span class=\"hb-steps__title\">Create a new project from a template.<\u002Fspan>\n            Use <strong>TEMPLATE · Ads<\u002Fstrong> for paid creative or <strong>TEMPLATE · Socials<\u002Fstrong> for organic. Don't start from a blank project.\n          <\u002Fspan>\n        <\u002Fli>\n        <li>\n          <span>\n            <span class=\"hb-steps__title\">Attach J+B DS · Ads &amp; Social — and change the default.<\u002Fspan>\n            Click <em>Start with context → Design System<\u002Fem>. The picker <strong>defaults to J+B Foundation (tokens only)<\u002Fstrong> — you must change it to <strong>\"J+B DS · Ads &amp; Social\"<\u002Fstrong> (id <code class=\"hb-inline\" style=\"background:rgba(0,0,0,0.05);padding:1px 5px;border-radius:2px;\">82362aea…<\u002Fcode>). That's the project that gives you the components, patterns, and Mood lift. Leave it on Foundation and you'll have tokens but nothing to build with.\n          <\u002Fspan>\n        <\u002Fli>\n        <li>\n          <span>\n            <span class=\"hb-steps__title\">Paste the onboarding prompt (§05) as your first chat message.<\u002Fspan>\n            It tells the project what to read, what to give you back, and what to hold off on. Do not skip this step. Do not paraphrase it. Paste it verbatim.\n          <\u002Fspan>\n        <\u002Fli>\n        <li>\n          <span>\n            <span class=\"hb-steps__title\">Wait for the read-back before you let the project draft.<\u002Fspan>\n            The read-back is the contract. If the read-back is weak — vague PHOTO_MODE choice, no Mood direction citation, no ratio plan — push back before any drafting starts.\n          <\u002Fspan>\n        <\u002Fli>\n        <li>\n          <span>\n            <span class=\"hb-steps__title\">Ship in all three social ratios.<\u002Fspan>\n            1:1, 4:5, 9:16. Every approved ad. Single-ratio submissions get sent back as incomplete.\n          <\u002Fspan>\n        <\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       02 · Ads vs Social\n       ============================================================ -->\n  <section class=\"hb-section\">\n    <p class=\"hb-section__eyebrow\">02 · Ads vs Social<\u002Fp>\n    <h2 class=\"hb-section__title\">Same DS. Different register.<\u002Fh2>\n\n    <div class=\"hb-prose\">\n      <p>Ads and Social share one design system, one token set, one Mood toolkit, one set of PHOTO_MODES. But they are <em>not<\u002Fem> the same register. Decide which one you're building before anything else — it changes the tone, how much content fits, and whether you even have a CTA.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"hb-pair\">\n      <div class=\"hb-pair__col\">\n        <h4>Ads · paid<\u002Fh4>\n        <p style=\"font-family: var(--jb-font-mono); font-size: 12px; color: var(--hb-ink-muted);\">Start from TEMPLATE · Ads<\u002Fp>\n        <p>One second to land — the punchiest register. One message, one CTA, no scroll. Image-led single frame. There is <strong>always<\u002Fstrong> a CTA: a button or a link.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"hb-pair__col\">\n        <h4>Social · organic<\u002Fh4>\n        <p style=\"font-family: var(--jb-font-mono); font-size: 12px; color: var(--hb-ink-muted);\">Start from TEMPLATE · Socials<\u002Fp>\n        <p>Earns a scroll — conversational. More content is welcome: carousels, multi-frame sequences, longer captions. Often <strong>no hard CTA<\u002Fstrong> at all. Brand-building over conversion.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hb-plate\">\n      <p class=\"hb-plate__eyebrow\">The rule<\u002Fp>\n      <p>Start from the right template and the register is set for you. <em>TEMPLATE · Ads<\u002Fem> for paid; <em>TEMPLATE · Socials<\u002Fem> for organic. Don't build a scrolling carousel in an ad project, or a single-CTA hard sell in a social project.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"hb-prose\">\n      <p>The full register hierarchy — Ads, Social, Landing Pages, Email — lives in Foundation's <code class=\"hb-inline\">brand-system.html<\u002Fcode> §01. Read it once; it explains why each surface carries a different energy, and where ads and social sit relative to the rest of the family.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       03 · Where work lives\n       ============================================================ -->\n  <section class=\"hb-section\">\n    <p class=\"hb-section__eyebrow\">03 · Where work lives<\u002Fp>\n    <h2 class=\"hb-section__title\">Your project, not the DS.<\u002Fh2>\n\n    <div class=\"hb-prose\">\n      <p>Junior designer work lives in <strong>per-campaign projects<\u002Fstrong> you create from the Ads or Socials template. It does <em>not<\u002Fem> live inside the J+B DS · Ads &amp; Social project itself. The DS is read-only reference; your campaigns sit downstream of it.<\u002Fp>\n\n      <p>The DS owns these filename patterns. Never author them in your campaign project, and never name your work with these patterns:<\u002Fp>\n\n      <ul class=\"hb-dots\">\n        <li><strong>tokens.css<\u002Fstrong> — Foundation-managed, do not touch.<\u002Fli>\n        <li><strong>components.html<\u002Fstrong>, <strong>templates.html<\u002Fstrong>, <strong>ds-*.html<\u002Fstrong> — DS reference docs.<\u002Fli>\n        <li><strong>patterns-*.html<\u002Fstrong>, <strong>patterns-*.jsx<\u002Fstrong> — ratified pattern files.<\u002Fli>\n        <li><strong>ads-shared.jsx<\u002Fstrong>, <strong>mood-directions*.jsx<\u002Fstrong>, <strong>ad-postures.jsx<\u002Fstrong> — DS primitives.<\u002Fli>\n        <li><strong>CHANGELOG.md<\u002Fstrong>, <strong>CLAUDE.md<\u002Fstrong>, <strong>README.md<\u002Fstrong> — DS governance.<\u002Fli>\n      <\u002Ful>\n\n      <p>Your campaign project gets this structure:<\u002Fp>\n\n      <pre class=\"hb-code\">campaigns/\n  &lt;campaign-name&gt;/\n    01-brief.md                            <span class=\"hb-code__token\">← optional, if you have one<\u002Fspan>\n    &lt;campaign&gt;-&lt;posture&gt;-&lt;ratio&gt;.html      <span class=\"hb-code__token\">← canonical, ratified<\u002Fspan>\n\n_drafts/\n  &lt;campaign-name&gt;/\n    &lt;anything-you-are-iterating-on&gt;        <span class=\"hb-code__token\">← WIP, can be messy<\u002Fspan>\n\n_archive/\n  &lt;date&gt;-&lt;campaign-name&gt;/                  <span class=\"hb-code__token\">← sunset, kept for reference<\u002Fspan><\u002Fpre>\n\n      <p>Three rules govern this:<\u002Fp>\n\n      <ul class=\"hb-dots\">\n        <li><strong>Drafts go in <code class=\"hb-inline\">_drafts/<\u002Fcode>.<\u002Fstrong> Anything with a version number, a \"FINAL\", a \"v3\", a copy-of suffix — it belongs in drafts. Drafts can be messy. They don't need to follow the strict naming convention.<\u002Fli>\n        <li><strong>Canonical work goes in <code class=\"hb-inline\">campaigns/<\u002Fcode>.<\u002Fstrong> Only files that have been reviewed and approved. Strict naming. No version numbers, no spaces, no caps.<\u002Fli>\n        <li><strong>Nothing gets deleted.<\u002Fstrong> Sunset work moves to <code class=\"hb-inline\">_archive/<\u002Fcode> with a date prefix. We keep history.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       03 · Naming convention\n       ============================================================ -->\n  <section class=\"hb-section\">\n    <p class=\"hb-section__eyebrow\">04 · Naming convention<\u002Fp>\n    <h2 class=\"hb-section__title\">Three parts. Lowercase. Hyphenated.<\u002Fh2>\n\n    <div class=\"hb-prose\">\n      <p>Every canonical file under <code class=\"hb-inline\">campaigns/<\u002Fcode> follows this format:<\u002Fp>\n\n      <pre class=\"hb-code\">campaigns/&lt;campaign-slug&gt;/&lt;campaign-slug&gt;-&lt;posture&gt;-&lt;ratio&gt;.html<\u002Fpre>\n\n      <p>The filename is the contract. Read left-to-right: <strong>which campaign<\u002Fstrong>, <strong>which photographic posture<\u002Fstrong>, <strong>which ratio<\u002Fstrong>. Anyone scanning a folder should know what's in a file before opening it.<\u002Fp>\n\n      <div class=\"hb-sub\">\n        <p class=\"hb-sub__label\">Anatomy<\u002Fp>\n        <h3 class=\"hb-sub__title\">campaign · posture · ratio<\u002Fh3>\n      <\u002Fdiv>\n\n      <table class=\"hb-table\">\n        <thead>\n          <tr><th>Part<\u002Fth><th>Rules<\u002Fth><th>Examples<\u002Fth><\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr>\n            <td>campaign<\u002Ftd>\n            <td>Lowercase, hyphenated. No spaces. Match across all files in the same campaign — pick once, use everywhere.<\u002Ftd>\n            <td class=\"hb-table__example\">mood · q1-launch · winter-trt · blokes-april<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>posture<\u002Ftd>\n            <td>One of the 6 PHOTO_MODES, <strong>or<\u002Fstrong> a Mood direction code (<code class=\"hb-inline\">d1-editorial-joi<\u002Fcode> through <code class=\"hb-inline\">d11-*<\u002Fcode>) when working from a ratified Mood direction.<\u002Ftd>\n            <td class=\"hb-table__example\">studio-warm · sport-dark · d1-editorial-joi<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>ratio<\u002Ftd>\n            <td>One of <code class=\"hb-inline\">1x1<\u002Fcode>, <code class=\"hb-inline\">4x5<\u002Fcode>, <code class=\"hb-inline\">9x16<\u002Fcode>, <code class=\"hb-inline\">16x9<\u002Fcode>. Use <code class=\"hb-inline\">x<\u002Fcode> not <code class=\"hb-inline\">×<\u002Fcode> or colon. Width comes first.<\u002Ftd>\n            <td class=\"hb-table__example\">1x1 · 4x5 · 9x16 · 16x9<\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <div class=\"hb-pair\">\n        <div class=\"hb-pair__col\">\n          <h4>Good<\u002Fh4>\n          <ul>\n            <li>campaigns/mood/mood-d1-editorial-joi-1x1.html<\u002Fli>\n            <li>campaigns/mood/mood-d1-editorial-joi-4x5.html<\u002Fli>\n            <li>campaigns/mood/mood-d1-editorial-joi-9x16.html<\u002Fli>\n            <li>campaigns/q1-launch/q1-launch-studio-warm-1x1.html<\u002Fli>\n            <li>campaigns/winter-trt/winter-trt-sport-dark-9x16.html<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"hb-pair__col\">\n          <h4>Don't<\u002Fh4>\n          <ul>\n            <li>final-final-v3.html<\u002Fli>\n            <li>Mood D1 1x1.html<\u002Fli>\n            <li>ad-1.html<\u002Fli>\n            <li>mood-1x1.html<\u002Fli>\n            <li>JoiAd_FINAL_REV2.html<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"hb-plate\">\n        <p class=\"hb-plate__eyebrow\">The three-ratio rule<\u002Fp>\n        <p>Every approved ad ships in <em>all three<\u002Fem> social ratios — 1:1, 4:5, 9:16 — as a minimum. Add 16:9 if the placement calls for it (promoted post, feature). If you submit one ratio, it gets sent back. Three ratios or it's not ready.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       04 · The onboarding prompt\n       ============================================================ -->\n  <section class=\"hb-section\">\n    <p class=\"hb-section__eyebrow\">05 · The onboarding prompt<\u002Fp>\n    <h2 class=\"hb-section__title\">Paste this verbatim. Don't paraphrase.<\u002Fh2>\n\n    <div class=\"hb-prose\">\n      <p>When you create a new campaign project and the J+B DS · Ads &amp; Social system is attached, this is your first chat message. Replace <code class=\"hb-inline\">[CAMPAIGN NAME]<\u002Fcode> and <code class=\"hb-inline\">[Joi / Blokes / both]<\u002Fcode> with your actual values. Everything else stays the same.<\u002Fp>\n\n      <pre class=\"hb-code\">I'm working on [CAMPAIGN NAME] for [Joi / Blokes / both]. New project,\nfresh start.\n\nBefore drafting anything, read these from the attached J+B DS · Ads &amp;\nSocial design system:\n\n  - ds-typography-reference.html — type system, the v2026.12.6 Headline\n    build, ratified visual register\n  - components.html — atomic component reference\n  - templates.html — layout patterns\n  - ads-shared.jsx — PHOTO_MODES, shared primitives (6 photographic modes:\n    studioWarm, studioCool, product, sportDark, sportSoft, outdoorMuted)\n  - mood-directions.jsx, mood-directions-2.jsx, mood-directions-3.jsx —\n    the 11 ratified Mood directions. Visual reference for \"what\n    confident J+B brand presence looks like.\"\n\nThen surface a short read-back to me before drafting:\n  1. Which PHOTO_MODE you're planning to use and why (based on theme +\n     copy register).\n  2. Which Mood direction (if any) you're aligning to.\n  3. The three ratios you'll ship (default: 1:1, 4:5, 9:16).\n\nNaming convention I'll be using — confirm this matches DS expectations:\n  campaigns/[campaign-slug]/[campaign-slug]-[posture]-[ratio].html\n  e.g., campaigns/[CAMPAIGN-SLUG]/[CAMPAIGN-SLUG]-studio-warm-1x1.html\n\nDrafts go in _drafts/[campaign-slug]/ — those don't need to follow the\nstrict convention.\n\nHold off on full draft until you've read and given the read-back. Source-\nverify everything; don't invent component patterns. If a posture or\ncomponent you need doesn't exist in the DS, flag it before drafting.<\u002Fpre>\n\n      <p>The prompt is doing three jobs at once:<\u002Fp>\n\n      <ul class=\"hb-dots\">\n        <li><strong>Tells the project what to read.<\u002Fstrong> Without this, the project may skim the DS and start drafting against vibes. The named files are the canonical inputs.<\u002Fli>\n        <li><strong>Demands a read-back before draft.<\u002Fstrong> The read-back catches misalignment at minute one instead of hour two. If the project's PHOTO_MODE choice feels wrong, fix it before any HTML gets written.<\u002Fli>\n        <li><strong>Establishes the naming contract.<\u002Fstrong> The project will follow your convention if you set it at the start. If you wait until draft three, the filenames will already be a mess.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       05 · Read-back protocol\n       ============================================================ -->\n  <section class=\"hb-section\">\n    <p class=\"hb-section__eyebrow\">06 · Read-back protocol<\u002Fp>\n    <h2 class=\"hb-section__title\">What the project owes you before drafting.<\u002Fh2>\n\n    <div class=\"hb-prose\">\n      <p>A good read-back is short, source-cited, and decisive. It is <em>not<\u002Fem> a summary of the DS. It is three answers to three questions.<\u002Fp>\n\n      <div class=\"hb-sub\">\n        <p class=\"hb-sub__label\">Question one<\u002Fp>\n        <h3 class=\"hb-sub__title\">Which PHOTO_MODE, and why?<\u002Fh3>\n      <\u002Fdiv>\n      <p>The project should name one of the six modes and justify it in one sentence based on the campaign's theme and copy register. If the answer is \"I'll use a mix\" — push back. Pick one per execution. Mixes happen across a series, not within a single ad.<\u002Fp>\n\n      <div class=\"hb-sub\">\n        <p class=\"hb-sub__label\">Question two<\u002Fp>\n        <h3 class=\"hb-sub__title\">Which Mood direction, if any?<\u002Fh3>\n      <\u002Fdiv>\n      <p>The 11 Mood directions are ratified brand language. If the project is aligning to one (most should be), it should name the direction code (D1, D5, etc.) and quote the triage doc's one-line characterization back to you. If it isn't aligning to any Mood direction, the project should explain why — usually a good reason exists (the campaign is doing something the Mood didn't cover), but the absence should be deliberate, not absent-minded.<\u002Fp>\n\n      <div class=\"hb-sub\">\n        <p class=\"hb-sub__label\">Question three<\u002Fp>\n        <h3 class=\"hb-sub__title\">Which three ratios will ship?<\u002Fh3>\n      <\u002Fdiv>\n      <p>Default: 1:1, 4:5, 9:16. If the project proposes a different set, ask why. Sometimes the answer is \"this is a 16:9 promoted-post execution\"; that's fine. \"I'll do 1:1 first and worry about the others later\" is not fine — the three ratios get planned together because the composition decisions cascade across them.<\u002Fp>\n\n      <div class=\"hb-plate\">\n        <p class=\"hb-plate__eyebrow\">Anti-pattern<\u002Fp>\n        <p>If the read-back comes back as paragraphs of DS reading instead of three decisive answers, that's a flag. The project read the docs but didn't make decisions. Send it back. Ask for the three answers, short, in your own words.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       06 · PHOTO_MODES reference\n       ============================================================ -->\n  <section class=\"hb-section\">\n    <p class=\"hb-section__eyebrow\">07 · PHOTO_MODES<\u002Fp>\n    <h2 class=\"hb-section__title\">Six photographic registers. Pick one.<\u002Fh2>\n\n    <div class=\"hb-prose\">\n      <p>Ratified in <code class=\"hb-inline\">ads-shared.jsx<\u002Fcode>. These are the placeholder gradient treatments that stand in for real photography until imagery lands. Pick one per execution; do not mix within an ad.<\u002Fp>\n\n      <table class=\"hb-table\">\n        <thead>\n          <tr><th>Mode<\u002Fth><th>Register<\u002Fth><th>Typical use<\u002Fth><\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr>\n            <td>studioWarm<\u002Ftd>\n            <td>Warm skin tones, close macro. Joi editorial.<\u002Ftd>\n            <td>Welcome, brand letters, hormone-balance copy, anything quietly intimate.<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>studioCool<\u002Ftd>\n            <td>Cool studio light, lighter palette. Clinical-editorial.<\u002Ftd>\n            <td>Lab results, Rx confirmations, product-clinical copy.<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>product<\u002Ftd>\n            <td>Clean, bright, product-led.<\u002Ftd>\n            <td>Either theme. Pack shots, ingredient stories, \"what's inside.\"<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>sportDark<\u002Ftd>\n            <td>Dark, moody, masculine.<\u002Ftd>\n            <td>Blokes default. Performance copy, recovery, strength register.<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>sportSoft<\u002Ftd>\n            <td>Desaturated, deep teal-brown. Editorial-Blokes.<\u002Ftd>\n            <td>Blokes mood-mixed. Slower copy register, reflective lines.<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>outdoorMuted<\u002Ftd>\n            <td>Outdoor, desaturated.<\u002Ftd>\n            <td>Blokes mood-mixed alternative. Movement, outdoors, place-based.<\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <p class=\"hb-prose\"><strong>Theme defaults.<\u002Fstrong> Joi work usually means <code class=\"hb-inline\">studioWarm<\u002Fcode> or <code class=\"hb-inline\">studioCool<\u002Fcode>. Blokes usually means <code class=\"hb-inline\">sportDark<\u002Fcode>, <code class=\"hb-inline\">sportSoft<\u002Fcode>, or <code class=\"hb-inline\">outdoorMuted<\u002Fcode>. <code class=\"hb-inline\">product<\u002Fcode> sits across both. Override these when copy demands it.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       07 · Mood directions\n       ============================================================ -->\n  <section class=\"hb-section\">\n    <p class=\"hb-section__eyebrow\">08 · The Mood directions<\u002Fp>\n    <h2 class=\"hb-section__title\">11 ratified directions. Start from here.<\u002Fh2>\n\n    <div class=\"hb-prose\">\n      <p>The Mood is the canonical brand expression right now. Eleven directions, founder-approved, ratified in <code class=\"hb-inline\">Mood-ads-lift-triage.html<\u002Fcode>. Most campaign work should align to one of them — not because the Mood owns every future execution, but because the Mood already answered the \"what does confident J+B look like\" question and you don't need to re-answer it from scratch.<\u002Fp>\n\n      <p>The directions live in <code class=\"hb-inline\">mood-directions.jsx<\u002Fcode>, <code class=\"hb-inline\">mood-directions-2.jsx<\u002Fcode>, and <code class=\"hb-inline\">mood-directions-3.jsx<\u002Fcode>. Each one pairs a posture with a copy register and a specific compositional approach.<\u002Fp>\n\n      <p>When you cite a Mood direction in a filename, use the code-and-slug format:<\u002Fp>\n\n      <ul class=\"hb-dots\">\n        <li><code class=\"hb-inline\">d1-editorial-joi<\u002Fcode> — direction one, Joi editorial register.<\u002Fli>\n        <li><code class=\"hb-inline\">d5-clinical-product<\u002Fcode> — direction five, clinical-product register.<\u002Fli>\n        <li>And so on through D11.<\u002Fli>\n      <\u002Ful>\n\n      <p>The slug after the direction code is the direction's name as it appears in the triage doc, hyphenated. Pull it from the source, don't invent it.<\u002Fp>\n\n      <div class=\"hb-pull\">\n        If you're not sure which direction to align to, ask. Re-aligning to a different direction at draft three is much more expensive than asking at minute one.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       08 · Ratios\n       ============================================================ -->\n  <section class=\"hb-section\">\n    <p class=\"hb-section__eyebrow\">09 · Ratios &amp; surface specs<\u002Fp>\n    <h2 class=\"hb-section__title\">Build at 1080. Honor the floors.<\u002Fh2>\n\n    <div class=\"hb-prose\">\n      <p>All J+B social surfaces render at the 1080 edge. Four canonical ratios:<\u002Fp>\n\n      <table class=\"hb-table\">\n        <thead>\n          <tr><th>Ratio<\u002Fth><th>Pixel dims<\u002Fth><th>Primary placement<\u002Fth><\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr><td>1:1<\u002Ftd><td>1080 × 1080<\u002Ftd><td>IG feed (square)<\u002Ftd><\u002Ftr>\n          <tr><td>4:5<\u002Ftd><td>1080 × 1350<\u002Ftd><td>IG feed (vertical)<\u002Ftd><\u002Ftr>\n          <tr><td>9:16<\u002Ftd><td>1080 × 1920<\u002Ftd><td>IG / TikTok story · reel<\u002Ftd><\u002Ftr>\n          <tr><td>16:9<\u002Ftd><td>1920 × 1080<\u002Ftd><td>Promoted post · feature placement<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <div class=\"hb-sub\">\n        <p class=\"hb-sub__label\">Type floors<\u002Fp>\n        <h3 class=\"hb-sub__title\">The minimum is not the default.<\u002Fh3>\n      <\u002Fdiv>\n\n      <p>Foundation tokens ratified in v2026.12.4 set legibility floors on social surfaces. Below these, type fails review at feed scale:<\u002Fp>\n\n      <ul class=\"hb-dots\">\n        <li><strong>Eyebrow<\u002Fstrong> — <code class=\"hb-inline\">22px<\u002Fcode> floor (<code class=\"hb-inline\">--jb-fs-ad-floor-eyebrow<\u002Fcode>).<\u002Fli>\n        <li><strong>Body<\u002Fstrong> — <code class=\"hb-inline\">20px<\u002Fcode> floor (<code class=\"hb-inline\">--jb-fs-ad-floor-body<\u002Fcode>).<\u002Fli>\n        <li><strong>Subhead<\u002Fstrong> — <code class=\"hb-inline\">28px<\u002Fcode> floor (<code class=\"hb-inline\">--jb-fs-ad-floor-subhead<\u002Fcode>).<\u002Fli>\n      <\u002Ful>\n\n      <p>These are floors. Go larger when you can. Display headlines on 1:1 should typically run at <code class=\"hb-inline\">--jb-fs-h3<\u002Fcode> or higher.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       09 · Pre-ship checklist\n       ============================================================ -->\n  <section class=\"hb-section\">\n    <p class=\"hb-section__eyebrow\">10 · Pre-ship checklist<\u002Fp>\n    <h2 class=\"hb-section__title\">Before you submit. Read it twice.<\u002Fh2>\n\n    <div class=\"hb-prose\">\n      <ul class=\"hb-dots\">\n        <li><strong>Three ratios present.<\u002Fstrong> 1:1, 4:5, 9:16 minimum. Not \"one done, others coming.\"<\u002Fli>\n        <li><strong>Filenames follow the convention.<\u002Fstrong> <code class=\"hb-inline\">campaign-posture-ratio.html<\u002Fcode>, lowercase, hyphenated, in <code class=\"hb-inline\">campaigns/&lt;slug&gt;/<\u002Fcode>.<\u002Fli>\n        <li><strong>No off-token colors.<\u002Fstrong> Every hex traces to <code class=\"hb-inline\">tokens.css<\u002Fcode>. If you used a one-off color, document why in the brief and flag it to the design lead before submit.<\u002Fli>\n        <li><strong>Type floors honored.<\u002Fstrong> Eyebrow ≥22px, body ≥20px, subhead ≥28px.<\u002Fli>\n        <li><strong>Photographic posture matches the Mood direction.<\u002Fstrong> If you said <code class=\"hb-inline\">studioWarm<\u002Fcode> + D1, the execution should read as that pairing, not drift to a different register.<\u002Fli>\n        <li><strong>Theme attribute set correctly.<\u002Fstrong> <code class=\"hb-inline\">data-theme=\"joi\"<\u002Fcode> or <code class=\"hb-inline\">data-theme=\"blokes\"<\u002Fcode> on the root. Don't ship un-themed.<\u002Fli>\n        <li><strong>No placeholder copy.<\u002Fstrong> \"Lorem ipsum\", \"Headline goes here\", \"your tagline\" — none of it. Either the real copy is in, or the file isn't ready.<\u002Fli>\n        <li><strong>Drafts archived.<\u002Fstrong> <code class=\"hb-inline\">_drafts/&lt;campaign&gt;/<\u002Fcode> still has your iterations; the approved version lives at <code class=\"hb-inline\">campaigns/&lt;campaign&gt;/<\u002Fcode>.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       10 · What not to do\n       ============================================================ -->\n  <section class=\"hb-section\">\n    <p class=\"hb-section__eyebrow\">11 · What not to do<\u002Fp>\n    <h2 class=\"hb-section__title\">Eight anti-patterns. Each one fails review.<\u002Fh2>\n\n    <div class=\"hb-prose\">\n      <ul class=\"hb-dots\">\n        <li><strong>Don't author DS files in a campaign project.<\u002Fstrong> No <code class=\"hb-inline\">tokens.css<\u002Fcode>, no <code class=\"hb-inline\">components.html<\u002Fcode>, no <code class=\"hb-inline\">CLAUDE.md<\u002Fcode>, no <code class=\"hb-inline\">CHANGELOG.md<\u002Fcode>. Those live upstream.<\u002Fli>\n        <li><strong>Don't invent a new PHOTO_MODE.<\u002Fstrong> If the 6 modes don't fit, flag it to the design lead. We may add a seventh; you don't.<\u002Fli>\n        <li><strong>Don't propose new tokens.<\u002Fstrong> Off-token colors get flagged in review. If you reach for a hex that doesn't exist in <code class=\"hb-inline\">tokens.css<\u002Fcode>, stop and ask. Foundation tokens go through a ratification process; campaign work doesn't seed them.<\u002Fli>\n        <li><strong>Don't ship one ratio.<\u002Fstrong> The three-ratio rule is non-negotiable for canonical work.<\u002Fli>\n        <li><strong>Don't use spaces, caps, or version stamps in canonical filenames.<\u002Fstrong> <code class=\"hb-inline\">Mood Joi v2.html<\u002Fcode> belongs in drafts; <code class=\"hb-inline\">mood-d1-editorial-joi-1x1.html<\u002Fcode> ships.<\u002Fli>\n        <li><strong>Don't delete archives.<\u002Fstrong> Sunset work moves to <code class=\"hb-inline\">_archive/<\u002Fcode> with a date prefix.<\u002Fli>\n        <li><strong>Don't paraphrase the onboarding prompt.<\u002Fstrong> Paste it verbatim. It does specific work that summaries don't.<\u002Fli>\n        <li><strong>Don't skip the read-back.<\u002Fstrong> No read-back, no draft. This is the single highest-leverage discipline in the system.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       11 · Escalation\n       ============================================================ -->\n  <section class=\"hb-section\">\n    <p class=\"hb-section__eyebrow\">12 · When you're stuck<\u002Fp>\n    <h2 class=\"hb-section__title\">Escalation routes.<\u002Fh2>\n\n    <div class=\"hb-prose\">\n\n      <div class=\"hb-sub\">\n        <p class=\"hb-sub__label\">Token gap<\u002Fp>\n        <h3 class=\"hb-sub__title\">A hex / size / weight you need doesn't exist in tokens.css.<\u002Fh3>\n      <\u002Fdiv>\n      <p>Use the closest available token. Document the gap in your campaign brief. Flag it to the design lead. <strong>Do not invent a new token locally.<\u002Fstrong> If two separate campaigns need the same gap, the design lead can file a brief upstream to Foundation. One campaign asking once stays inline.<\u002Fp>\n\n      <div class=\"hb-sub\">\n        <p class=\"hb-sub__label\">Component gap<\u002Fp>\n        <h3 class=\"hb-sub__title\">You need a pattern that isn't in components.html.<\u002Fh3>\n      <\u002Fdiv>\n      <p>Build it inside your campaign project, scoped to that campaign's files only. Don't put it in any pattern file. If it proves out across multiple campaigns, the design lead can promote it into the DS via the ratification process.<\u002Fp>\n\n      <div class=\"hb-sub\">\n        <p class=\"hb-sub__label\">Mood gap<\u002Fp>\n        <h3 class=\"hb-sub__title\">The campaign doesn't fit any Mood direction.<\u002Fh3>\n      <\u002Fdiv>\n      <p>Possible — the Mood is 11 directions, not infinity. Write a one-paragraph rationale: what register the campaign needs, why no existing direction covers it, what compositional approach you'll take. Send to the design lead before drafting. Once approved, build it; we may end up promoting your approach into a Mood direction twelve down the line.<\u002Fp>\n\n      <div class=\"hb-sub\">\n        <p class=\"hb-sub__label\">Posture / Mood conflict<\u002Fp>\n        <h3 class=\"hb-sub__title\">The PHOTO_MODE you picked doesn't match the Mood direction's posture.<\u002Fh3>\n      <\u002Fdiv>\n      <p>This usually means you picked the wrong mode, the wrong direction, or both. Re-read the direction's source line in the triage doc. If you still disagree, write the rationale and ping the design lead — sometimes the Mood doc's posture line was written before a refinement and the direction has drifted. Don't ship the conflict silently.<\u002Fp>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       12 · Glossary\n       ============================================================ -->\n  <section class=\"hb-section\">\n    <p class=\"hb-section__eyebrow\">13 · Glossary<\u002Fp>\n    <h2 class=\"hb-section__title\">Vocabulary, quietly.<\u002Fh2>\n\n    <div class=\"hb-prose\">\n      <table class=\"hb-table\">\n        <thead>\n          <tr><th>Term<\u002Fth><th>Meaning<\u002Fth><\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr><td>Canonical<\u002Ftd><td>A ratified, named, in-<code class=\"hb-inline\">campaigns/<\u002Fcode> file that we treat as production. Distinct from drafts.<\u002Ftd><\u002Ftr>\n          <tr><td>DS<\u002Ftd><td>Design system. In this handbook, almost always means J+B DS · Ads &amp; Social. The other sisters (Website, Email, Foundation) are referenced by name when relevant.<\u002Ftd><\u002Ftr>\n          <tr><td>Foundation<\u002Ftd><td>The upstream source of <code class=\"hb-inline\">tokens.css<\u002Fcode>. Color, type, spacing, motion. Everything else lives in a sister DS.<\u002Ftd><\u002Ftr>\n          <tr><td>Mood<\u002Ftd><td>The 11 ratified directions in <code class=\"hb-inline\">Mood-ads-lift-triage.html<\u002Fcode>. Canonical brand language right now.<\u002Ftd><\u002Ftr>\n          <tr><td>PHOTO_MODE<\u002Ftd><td>One of the 6 photographic registers in <code class=\"hb-inline\">ads-shared.jsx<\u002Fcode>. Placeholder gradient until real imagery lands.<\u002Ftd><\u002Ftr>\n          <tr><td>Posture<\u002Ftd><td>The DS's term for a layout + photographic + copy stance. A direction = a posture + a register.<\u002Ftd><\u002Ftr>\n          <tr><td>Read-back<\u002Ftd><td>What the project gives you before it drafts. Three answers: PHOTO_MODE, Mood direction, ratios.<\u002Ftd><\u002Ftr>\n          <tr><td>Source-verify<\u002Ftd><td>To check a claim against the file it cites. The DS is the source; if you can't find the citation, the claim is unsupported.<\u002Ftd><\u002Ftr>\n          <tr><td>Theme<\u002Ftd><td><code class=\"hb-inline\">data-theme=\"joi\"<\u002Fcode> or <code class=\"hb-inline\">data-theme=\"blokes\"<\u002Fcode>. Single attribute, two skins.<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Trust lockup -->\n  <div class=\"hb-proof\">\n    <div class=\"hb-proof__item\">\n      <span class=\"hb-proof__label\">Foundation<\u002Fspan>\n      <span class=\"hb-proof__value\">v2027.01.1<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"hb-proof__item\">\n      <span class=\"hb-proof__label\">Ads &amp; Social DS<\u002Fspan>\n      <span class=\"hb-proof__value\">v1.4<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"hb-proof__item\">\n      <span class=\"hb-proof__label\">Mood corpus<\u002Fspan>\n      <span class=\"hb-proof__value\">v2026.12.4<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"hb-proof__item\">\n      <span class=\"hb-proof__label\">Handbook<\u002Fspan>\n      <span class=\"hb-proof__value\">v1.1<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p class=\"hb-pull\" style=\"font-style: italic; font-family: var(--jb-font-serif);\">Source-verify everything. Then draft.<\u002Fp>\n\n  <!-- Footer -->\n  <footer class=\"hb-foot\">\n    <div class=\"hb-foot__mark\">J+B<\u002Fdiv>\n    <div class=\"hb-foot__meta\">\n      <div>Designer Handbook · No. 01<\u002Fdiv>\n      <div>Edition v1.1 · 2026.06.01<\u002Fdiv>\n      <div>J+B DS · Ads &amp; Social<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fmain>\n\n\n\n<\u002Fbody><\u002Fhtml>"
